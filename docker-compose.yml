services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flasky-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - flasky-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flasky-redis
    ports:
      - "6380:6379"   # host 6380 → container 6379 (avoid clash with another local Redis on 6379)
    networks:
      - flasky-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: flasky-minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"   # host 9100 → container 9000 (avoid clash with php-fpm on :9000)
      - "9101:9001"   # host 9101 → container 9001 (web console)
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-flasky-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-flasky-admin-change-me}
    volumes:
      - minio-data:/data
    networks:
      - flasky-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: flasky-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/products;
      mc mb --ignore-existing local/avatars;
      mc anonymous set download local/products;
      mc anonymous set download local/avatars;
      exit 0;
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-flasky-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-flasky-admin-change-me}
    networks:
      - flasky-network

  flasky-backend:
    build: .
    container_name: flasky-backend
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://admin:admin@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9100
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-flasky-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-flasky-admin-change-me}
      - MINIO_BUCKET_PRODUCTS=products
      - MINIO_BUCKET_AVATARS=avatars
    volumes:
      - .:/app
    networks:
      - flasky-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: flasky-celery-worker
    command: celery -A celery_worker.celery worker --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://admin:admin@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    networks:
      - flasky-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: flasky-celery-beat
    command: celery -A celery_worker.celery beat --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://admin:admin@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    networks:
      - flasky-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: .
    container_name: flasky-flower
    command: celery -A celery_worker.celery flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=amqp://admin:admin@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - flasky-network
    depends_on:
      - celery-worker

  flasky-frontend:
    build: ./flasky-frontend
    container_name: flasky-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./flasky-frontend:/app
      - /app/node_modules
    networks:
      - flasky-network

  nginx:
    image: nginx:alpine
    container_name: flasky-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flasky-backend
      - flasky-frontend
    networks:
      - flasky-network

networks:
  flasky-network:
    driver: bridge

volumes:
  minio-data:
